<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoBI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body class="upload-body">


<div class="upload-container">

    <div class="brand">

        <div class="brand-logo">
            <i class="bi bi-bar-chart-fill"></i>
        </div>

        <h1>AutoBI</h1>

    </div>


    <div class="upload-card">

        <div class="upload-icon">

            <i class="bi bi-file-earmark-spreadsheet"></i>

        </div>


        <h2>
            Turn Excel Into Insights
        </h2>


        <p>
            Upload your Excel file and AutoBI will
            automatically analyze your data and
            generate an interactive analytics dashboard.
        </p>


        <form
            action="{{ url_for('upload') }}"
            method="POST"
            enctype="multipart/form-data"
            id="upload-form"
        >


            <label
                for="file-input"
                class="drop-zone"
                id="drop-zone"
            >

                <i class="bi bi-cloud-arrow-up"></i>

                <span id="file-label">
                    Drag & drop Excel file here
                </span>

                <small>
                    or click to browse
                </small>

                <input
                    type="file"
                    id="file-input"
                    name="file"
                    accept=".xlsx,.xls"
                    required
                >

            </label>


            <button
                type="submit"
                class="analyze-button"
            >

                <i class="bi bi-stars"></i>

                Analyze & Build Dashboard

            </button>

        </form>


        <div class="features">

            <span>
                <i class="bi bi-check-circle"></i>
                Automatic KPIs
            </span>

            <span>
                <i class="bi bi-check-circle"></i>
                Smart Charts
            </span>

            <span>
                <i class="bi bi-check-circle"></i>
                Dynamic Filters
            </span>

        </div>

    </div>

</div>


<script>

const fileInput =
    document.getElementById("file-input");

const fileLabel =
    document.getElementById("file-label");


fileInput.addEventListener(
    "change",
    function () {

        if (this.files.length > 0) {

            fileLabel.textContent =
                this.files[0].name;

        }

    }
);

</script>


</body>

</html>
